name: Laura agent automation

# Gmail polling is NOT here any more. GitHub treats `schedule` as best-effort
# and drops high-frequency crons hard — a "*/10" was landing every 45-160
# minutes in practice, which is useless for answering applicant mail. An
# external cron (cron-job.org) now calls /api/intake-gmail-poll directly.
#
# The 6-hourly digest stays: GitHub honours low-frequency schedules fine, and a
# late digest costs nothing.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laura-agent-automation
  cancel-in-progress: false

jobs:
  poll-gmail:
    name: Poll Gmail replies (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Call Laura Gmail poll endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.LAURA_SITE_URL }}
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?Set GitHub repository secret CRON_SECRET to match the Vercel CRON_SECRET.}"
          BASE_URL="${SITE_URL:-https://www.villageservers.com}"
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            "${BASE_URL%/}/api/intake-gmail-poll"

  larry-digest:
    name: Send Larry digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */6 * * *'
    steps:
      - name: Call Laura digest endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.LAURA_SITE_URL }}
        run: |
          set -euo pipefail
          : "${CRON_SECRET:?Set GitHub repository secret CRON_SECRET to match the Vercel CRON_SECRET.}"
          BASE_URL="${SITE_URL:-https://www.villageservers.com}"
          curl --fail --show-error --silent \
            --request POST \
            --header "x-cron-secret: ${CRON_SECRET}" \
            "${BASE_URL%/}/api/intake-digest"
